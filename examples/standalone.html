<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Murciélagos</title>
<style>
  html, body { margin: 0; height: 100%; background: linear-gradient(#3a2f63, #6b4f9e); overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  .moon {
    position: fixed; top: 60px; right: 90px; width: 80px; height: 80px;
    background: #f3eecb; border-radius: 50%; box-shadow: 0 0 40px 10px rgba(243,238,203,0.4);
  }
</style>
</head>
<body>
  <div class="moon"></div>
  <canvas id="bats-canvas"></canvas>

  <script>
  // --- bats.js (incrustado, sin dependencias externas) ---
  (function (global) {
    'use strict';

    function Bat(canvas, opts) {
      this.canvas = canvas;
      this.opts = opts;
      this.reset(true);
    }

    Bat.prototype.reset = function (initial) {
      const w = this.canvas.width;
      const h = this.canvas.height;
      this.size = this.opts.minSize + Math.random() * (this.opts.maxSize - this.opts.minSize);
      this.x = initial ? Math.random() * w : (Math.random() < 0.5 ? -this.size : w + this.size);
      this.y = initial ? Math.random() * h : Math.random() * h * 0.8;
      this.speedX = (0.4 + Math.random() * 1.2) * (Math.random() < 0.5 ? -1 : 1);
      this.speedY = (Math.random() - 0.5) * 0.4;
      this.flapSpeed = 0.15 + Math.random() * 0.15;
      this.flapPhase = Math.random() * Math.PI * 2;
      this.bobSpeed = 0.01 + Math.random() * 0.02;
      this.bobPhase = Math.random() * Math.PI * 2;
      this.bobAmount = 10 + Math.random() * 20;
      this.opacity = 0.5 + Math.random() * 0.5;
      this.baseY = this.y;
    };

    Bat.prototype.update = function (t) {
      const w = this.canvas.width;
      const h = this.canvas.height;

      this.x += this.speedX;
      this.baseY += this.speedY;
      this.y = this.baseY + Math.sin(t * this.bobSpeed + this.bobPhase) * this.bobAmount;
      this.flapPhase += this.flapSpeed;

      if (this.x < -this.size * 2 || this.x > w + this.size * 2 || this.baseY < -this.size * 2 || this.baseY > h + this.size * 2) {
        this.reset(false);
      }
    };

    Bat.prototype.draw = function (ctx) {
      const s = this.size;
      const flap = Math.sin(this.flapPhase);
      const wingLift = flap * (s * 0.45);
      const facingLeft = this.speedX < 0;

      ctx.save();
      ctx.translate(this.x, this.y);
      if (facingLeft) ctx.scale(-1, 1);
      ctx.globalAlpha = this.opacity;
      ctx.fillStyle = this.opts.color;

      ctx.beginPath();
      ctx.ellipse(0, 0, s * 0.14, s * 0.22, 0, 0, Math.PI * 2);
      ctx.fill();

      drawWing(ctx, s, wingLift, 1);
      drawWing(ctx, s, wingLift, -1);

      ctx.beginPath();
      ctx.moveTo(-s * 0.08, -s * 0.2);
      ctx.lineTo(-s * 0.14, -s * 0.34);
      ctx.lineTo(-s * 0.02, -s * 0.22);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(s * 0.08, -s * 0.2);
      ctx.lineTo(s * 0.14, -s * 0.34);
      ctx.lineTo(s * 0.02, -s * 0.22);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    };

    function drawWing(ctx, s, lift, side) {
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.05);
      ctx.quadraticCurveTo(side * s * 0.5, -s * 0.5 - lift, side * s * 0.95, -s * 0.15 - lift * 0.6);
      ctx.quadraticCurveTo(side * s * 0.65, -s * 0.05 - lift * 0.3, side * s * 0.55, s * 0.12);
      ctx.quadraticCurveTo(side * s * 0.35, s * 0.02, side * s * 0.15, s * 0.18);
      ctx.quadraticCurveTo(side * s * 0.05, s * 0.05, 0, s * 0.1);
      ctx.closePath();
      ctx.fill();
    }

    const Bats = {
      init: function (canvas, options) {
        const opts = Object.assign(
          { count: 15, color: '#111111', minSize: 14, maxSize: 32, background: null },
          options || {}
        );

        const ctx = canvas.getContext('2d');
        let bats = [];
        let running = true;
        let t = 0;

        function resize() {
          canvas.width = canvas.clientWidth || canvas.offsetWidth || window.innerWidth;
          canvas.height = canvas.clientHeight || canvas.offsetHeight || window.innerHeight;
        }

        function build() {
          bats = [];
          for (let i = 0; i < opts.count; i++) bats.push(new Bat(canvas, opts));
        }

        function loop() {
          if (!running) return;
          t += 1;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          if (opts.background) {
            ctx.fillStyle = opts.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          }
          for (const bat of bats) {
            bat.update(t);
            bat.draw(ctx);
          }
          requestAnimationFrame(loop);
        }

        resize();
        build();
        loop();
        window.addEventListener('resize', resize);

        return {
          stop: () => { running = false; },
          start: () => { if (!running) { running = true; loop(); } },
          setCount: (n) => { opts.count = n; build(); },
        };
      },
    };

    global.Bats = Bats;
  })(window);

  // --- uso ---
  Bats.init(document.getElementById('bats-canvas'), {
    count: 18,
    color: '#0d0410',
    minSize: 16,
    maxSize: 36,
  });
  </script>
</body>
</html>
